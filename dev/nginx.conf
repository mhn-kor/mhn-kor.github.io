server {
  listen 80;
  root /site;
  index index.html;
  charset utf-8;

  # 로컬에서는 항상 최신 파일을 보도록. 프로덕션 캐시(max-age=600)와 헷갈리지 않게 합니다.
  add_header Cache-Control "no-store" always;

  # app.js 를 건드리지 않고 API 주소만 로컬로 돌립니다.
  # 프로덕션에는 window.MHNKR_API 가 없으므로 그대로 Supabase 를 씁니다.
  sub_filter '</head>' '<script>window.MHNKR_API="http://localhost:8080";</script></head>';
  sub_filter_types text/html;
  sub_filter_once on;

  # Supabase 는 PostgREST 를 /rest/v1 아래에 두지만 순수 PostgREST 는 루트에서 서비스합니다.
  # 프리픽스를 떼고 넘겨 앱의 경로를 그대로 쓰게 합니다. 같은 출처라 CORS 도 필요 없습니다.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    # 프로덕션과 같은 모양으로 넘깁니다. 프록시는 «뒤에» 덧붙이므로 맨 뒤가 진짜 IP 이고,
    # schema.sql 의 client_ip() 도 맨 뒤를 읽습니다.
    # 다만 도커에서 보이는 주소는 사설 대역이라 투표 IP 상한은 로컬에서 켜지지 않습니다
    # (ip_is_distinguishing 이 false). 상한을 시험하려면 공인 IP 를 직접 넣어 부르세요:
    #   curl -H 'X-Forwarded-For: 203.0.113.5' ... /rest/v1/rpc/vote_recommended_build
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
  }

  # dev/ 와 tools/ 는 브라우저에 노출할 필요가 없습니다.
  location ~ ^/(dev|tools|\.git)/ { deny all; }
}
